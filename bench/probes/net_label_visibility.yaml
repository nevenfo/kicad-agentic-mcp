project_name: pullup
toolsets: [project, sch_components, sch_wiring, sch_analysis, sch_batch, sch_export]
# E25 probe: does `list_schematic_nets` — the tool the model-fit oracle uses for
# its `nets_present` invariant — see a net label that was actually written?
#
# 8 of 28 `applied_invalid` attempts in the E24 run reported `missing=['VPU']`
# on task 04_reference_heavy, whose invariant is `nets: ["VPU"]`. That tool is
# one of the fifteen the capability manifest marks ADVISORY, because its
# in-process connectivity has disagreed with kicad-cli ERC before (E7). So
# before attributing those 8 to the model, this reproduces the exact shape the
# task asks for and asks three sources what they see:
#   - list_schematic_nets  (what the oracle believes)
#   - run_erc              (kicad-cli's own verdict)
# and the raw .kicad_sch is inspected separately for the label text.
#
# Geometry is the task's own: R1 at (101.6, 88.9), Device:R pin 1 at
# (101.6, 85.09) and pin 2 at (101.6, 92.71), both already on the 1.27 mm grid.
steps:
  - tool: create_project
    args: { path: "$WORK", name: "$NAME" }
  - tool: batch_place_components
    args:
      schematic: "$SCH"
      components:
        - { lib_id: "Device:R", reference: "R1", value: "10k", x: 101.6, y: 88.9 }
        - { lib_id: "power:PWR_FLAG", reference: "#FLG01", x: 101.6, y: 85.09 }
  - tool: add_power_symbol
    args: { schematic: "$SCH", power_net: "+3V3", x: 101.6, y: 85.09 }
  - tool: add_schematic_net_label
    args: { schematic: "$SCH", net: "VPU", x: 101.6, y: 92.71 }
  - tool: list_schematic_nets
    args: { schematic: "$SCH" }
  - tool: run_erc
    args: { schematic: "$SCH", severity: "error" }
