id: manufacturing_exports
title: BOM, netlist, ERC report and schematic SVG from a real design
project_name: exports
category: manufacturing
# `pcb_export` used to be in this list purely because `export_bom` was registered
# there while reading only schematic data (E8). The tool now lives in
# `sch_export` next to the other schematic exports, so a schematic-only task
# loads schematic-only toolsets.
toolsets: [project, sch_components, sch_wiring, sch_batch, sch_export, sch_analysis]

# Deliberately reuses the divider topology: this task measures the export path
# (kicad-cli round trips), not the authoring path, so the design under it must
# be uninteresting and already known ERC-clean.
# Plain-language intents, used by `--load-mode search` to score capability
# retrieval with no oracle knowledge of the tool names.
intents:
  - "create a new kicad project"
  - "place resistor symbols and power symbols"
  - "connect two component pins with a wire and add a net label"
  - "export bom and netlist and schematic svg"
  - "run erc and list the components"

steps:
  - tool: create_project
    args: { path: "$WORK", name: "$NAME" }

  - tool: batch_place_components
    args:
      schematic: "$SCH"
      components:
        - { lib_id: "Device:R", reference: "R1", value: "10k", x: 100.33, y: 80.01 }
        - { lib_id: "Device:R", reference: "R2", value: "10k", x: 100.33, y: 95.25 }
        - { lib_id: "power:PWR_FLAG", reference: "#FLG01", x: 100.33, y: 76.2 }
        - { lib_id: "power:PWR_FLAG", reference: "#FLG02", x: 100.33, y: 99.06 }

  - tool: add_power_symbol
    args: { schematic: "$SCH", power_net: "+3V3", x: 100.33, y: 76.2 }
  - tool: add_power_symbol
    args: { schematic: "$SCH", power_net: "GND", x: 100.33, y: 99.06 }
  - tool: connect_pins
    args: { schematic: "$SCH", ref1: "R1", pin1: "2", ref2: "R2", pin2: "1" }
  - tool: add_schematic_net_label
    args: { schematic: "$SCH", net: "VOUT", x: 100.33, y: 87.63 }

  - tool: export_bom
    args: { schematic: "$SCH", output: "$WORK/bom.csv" }
  - tool: generate_netlist
    args: { schematic: "$SCH", output: "$WORK/exports.net" }
  - tool: export_schematic_svg
    args: { schematic: "$SCH", output: "$WORK/sch.svg" }

assert:
  - kind: all_steps_ok
  - kind: erc_max_errors
    value: 0
  - kind: file_exists
    value: "$WORK/bom.csv"
  - kind: file_exists
    value: "$WORK/exports.net"
