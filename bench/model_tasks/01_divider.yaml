id: model_divider
title: "Resistive divider, ERC-clean"
project_name: divider
category: schematic_simple
# Same fixture as bench/tasks/01_sch_divider.yaml, already proven by the
# golden suite — the model is graded against a design known to be buildable
# with this exact geometry, not against an unverified one.
objective: |
  Build a 10k/10k resistive voltage divider between +3V3 and GND, with the
  midpoint net labeled VOUT. Work inside the schematic at $SCH, in a project
  created at $WORK named $NAME.

# hint level: how much of the geometry the model is handed.
#   full    — everything: coordinates, pin offsets, PWR_FLAG requirement.
#             A grade 3 here proves the model can transcribe given geometry
#             into valid Plan IR — the floor, not the whole measurement.
#   minimal — only what is not electronics and not guessable: the grid and
#             the ${...}-in-a-coordinate refusal (D23). No coordinates, no
#             pin offsets, no PWR_FLAG mention.
#   none    — the objective above, nothing else.
hints:
  full: |
    Device:R pins sit at (component_x, component_y - 3.81) for pin 1 and
    (component_x, component_y + 3.81) for pin 2. Place R1 at (100.33, 80.01)
    and R2 at (100.33, 95.25), so R1's pin 2 (100.33, 83.82) and R2's pin 1
    (100.33, 91.44) can be wired together, with the VOUT label at their
    midpoint (100.33, 87.63). Each power rail needs a PWR_FLAG anchored at the
    same coordinate as its power symbol or ERC reports the rail as not driven:
    +3V3 and a PWR_FLAG at (100.33, 76.2), GND and a PWR_FLAG at
    (100.33, 99.06). Every coordinate above is already a multiple of the
    1.27mm schematic grid.
  minimal: |
    The schematic grid is 1.27mm; every coordinate you write in a
    place/power/label/wire/decouple operation is snapped to it. A coordinate
    field must be a literal number, never a ${...} reference.
  none: ""

invariants:
  components: ["R1", "R2"]
  nets: ["VOUT"]
  erc_max_errors: 0
